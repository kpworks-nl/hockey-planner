document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pan class=\"pill\">● Last updated May 8, 2026<\u002Fspan>\n    <span>Hockey Planner — Tools for every coach and trainer<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"summary\">\n  <div class=\"summary-grid\">\n    <div class=\"sum-card\">\n      <div class=\"icon\">🔒<\u002Fdiv>\n      <h3>No personal data<\u002Fh3>\n      <p>We don't collect, store, or transmit any personal information about you or your players.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"sum-card\">\n      <div class=\"icon\">📱<\u002Fdiv>\n      <h3>Stays on device<\u002Fh3>\n      <p>Teams, lineups and plans live only on your phone. Uninstall the app and they're gone.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"sum-card\">\n      <div class=\"icon\">🚫<\u002Fdiv>\n      <h3>No tracking<\u002Fh3>\n      <p>Zero analytics. Zero advertising. Zero behavioral profiling. Ever.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<main>\n\n<section>\n  <h2><span class=\"num\">01<\u002Fspan> Introduction<\u002Fh2>\n  <p>Hockey Planner (\"the App\") is a field hockey lineup and substitution manager for youth teams. This Privacy Policy explains how we handle your information when you use the App.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">02<\u002Fspan> Data We Collect<\u002Fh2>\n  <div class=\"callout\"><strong>We do not collect any personal data.<\u002Fstrong> Everything you enter stays on your device.<\u002Fdiv>\n  <p style=\"margin-top:14px;\">The App stores all data locally on your device, including:<\u002Fp>\n  <ul>\n    <li>Team names and player names you enter<\u002Fli>\n    <li>Lineups, match plans, and formations you create<\u002Fli>\n    <li>Player position assignments<\u002Fli>\n    <li>Your language preference (Dutch or English)<\u002Fli>\n    <li>Your premium purchase status<\u002Fli>\n  <\u002Ful>\n  <p>This data never leaves your device. We do not have access to it, and it is not transmitted to any server.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">03<\u002Fspan> Third-Party Services<\u002Fh2>\n  <p>The App uses the following third-party services:<\u002Fp>\n  <h3 class=\"sub\">Google Play In-App Billing<\u002Fh3>\n  <p>If you purchase the Premium upgrade, the transaction is processed by Google Play. Google handles the payment and may collect information as described in their privacy policy. We do not receive or store your payment details.<\u002Fp>\n  <h3 class=\"sub\">RevenueCat<\u002Fh3>\n  <p>We use RevenueCat to manage in-app purchases and verify your premium status. RevenueCat may process an anonymous user identifier to track your purchase. No personal information (name, email, etc.) is shared with RevenueCat by the App. For more information, see RevenueCat's privacy policy at <a href=\"https://www.revenuecat.com/privacy\" target=\"_blank\" rel=\"noopener\">revenuecat.com/privacy<\u002Fa>.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">04<\u002Fspan> Data Storage and Security<\u002Fh2>\n  <p>All app data is stored locally on your device using AsyncStorage. If you uninstall the App, all stored data will be permanently deleted. We do not maintain any backups of your data.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">05<\u002Fspan> Children's Privacy<\u002Fh2>\n  <p>The App is designed for coaches and team managers of youth hockey teams. The App does not knowingly collect personal information from children. Player names entered by the coach or team manager are stored only on the device and are not transmitted anywhere.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">06<\u002Fspan> Analytics and Tracking<\u002Fh2>\n  <p>The App does not use any analytics, tracking, or advertising frameworks. We do not track your usage, location, or behavior.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">07<\u002Fspan> Data Sharing<\u002Fh2>\n  <p>We do not share, sell, or transfer any data to third parties. The only external communication occurs during in-app purchase verification through Google Play and RevenueCat.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">08<\u002Fspan> Permissions<\u002Fh2>\n  <p>The App requests the following permissions:<\u002Fp>\n  <ul>\n    <li><strong style=\"color:var(--lime-soft);\">Vibration<\u002Fstrong> — Used to alert coaches about substitutions during matches. No data is collected.<\u002Fli>\n    <li><strong style=\"color:var(--lime-soft);\">In-App Billing<\u002Fstrong> — Used for the optional Premium upgrade purchase through Google Play.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">09<\u002Fspan> Changes to This Policy<\u002Fh2>\n  <p>We may update this Privacy Policy from time to time. Any changes will be reflected in the App or on our website. Your continued use of the App after changes constitutes acceptance of the updated policy.<\u002Fp>\n<\u002Fsection>\n\n<section>\n  <h2><span class=\"num\">10<\u002Fspan> Contact<\u002Fh2>\n  <p>If you have any questions about this Privacy Policy, please get in touch:<\u002Fp>\n  <div class=\"contact-card\">\n    <span class=\"label\">Email<\u002Fspan>\n    <a class=\"email\" href=\"mailto:support@kpworks.nl\">support@kpworks.nl<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer>\n  <div class=\"row\">\n    <a href=\"Hockey Planner Promo.html\">← Back to Hockey Planner<\u002Fa>\n    <a href=\"mailto:support@kpworks.nl\">support@kpworks.nl<\u002Fa>\n  <\u002Fdiv>\n  <div>© 2026 Hockey Planner. All rights reserved.<\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<\u002Fbody><\u002Fhtml>"
